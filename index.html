<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけて節約</h2>
  </header>

  <main>
    <section aria-labelledby="entry-form-heading">
      <h2 id="entry-form-heading">家計簿に登録</h2>
      <form>
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" required>
        </p>
        <p>
          <label for="entry-type">区分</label>
          <select id="entry-type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="number" id="entry-amount" name="amount" min="0" step="1" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <section aria-labelledby="total-heading">
      <h2 id="total-heading">合計金額</h2>
      <p><output name="total">0</output> 円</p>
    </section>

    <section aria-labelledby="entries-heading">
      <h2 id="entries-heading">登録データ一覧</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額（円）</th>
          </tr>
        </thead>
        <tbody id="entry-list">
          <tr>
            <td colspan="4">登録データはありません。</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
